<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ストレッチタイマー</title>
<meta name="theme-color" content="#0e5e4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ストレッチ">
<style>
  :root{
    --ink:#1c2430;
    --paper:#f6f4ee;
    --stretch:#0e5e4a;
    --stretch-soft:#e3f0ea;
    --rest:#2b3a67;
    --rest-soft:#e7eaf4;
    --ready:#8a5a12;
    --line:#d8d4c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    transition:background .5s ease;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;
  }
  body.phase-stretch{background:var(--stretch)}
  body.phase-rest{background:var(--rest)}
  body.phase-ready{background:var(--ink)}
  body.phase-stretch,body.phase-rest,body.phase-ready{color:#fff}

  .wrap{width:100%;max-width:480px;padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;flex:1}

  h1{font-size:15px;font-weight:600;letter-spacing:.18em}
  .setup label{display:block;font-size:12px;letter-spacing:.08em;margin-bottom:6px;opacity:.75}
  .setup input[type=text]{
    width:100%;font-size:20px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .setup .hint{font-size:12px;opacity:.6;margin-top:6px;line-height:1.6}
  .row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
  .row input[type=checkbox]{width:18px;height:18px;accent-color:var(--stretch)}

  .preset-row{display:flex;gap:8px;margin-bottom:16px}
  .preset-row select{
    flex:1;min-width:0;font-size:15px;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font-family:inherit;
  }
  .preset-row .mini{
    flex:0 0 auto;font-size:14px;font-weight:600;padding:10px 14px;
    border:1.5px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);
  }
  .preset-row .mini:disabled{opacity:.4;cursor:default}

  .display{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;gap:8px;min-height:260px;
  }
  .phase-label{font-size:22px;font-weight:700;letter-spacing:.3em;text-indent:.3em}
  .time{
    font-size:min(34vw,150px);font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .sub{font-size:14px;opacity:.75;font-variant-numeric:tabular-nums}
  .progress{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
  body:not(.running) .progress{background:var(--line)}
  .progress .bar{height:100%;background:currentColor;width:0%}

  .controls{display:flex;gap:12px}
  button{
    flex:1;font-size:17px;font-weight:600;padding:16px;border:none;border-radius:12px;
    cursor:pointer;font-family:inherit;letter-spacing:.05em;
  }
  #startBtn{background:var(--stretch);color:#fff}
  body.running #startBtn{background:rgba(255,255,255,.18);color:#fff}
  #resetBtn{background:transparent;border:1.5px solid var(--line);color:inherit;flex:0 0 30%}
  body.running #resetBtn{border-color:rgba(255,255,255,.4)}
  button:active{transform:scale(.98)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>ストレッチタイマー</h1>

  <div class="setup" id="setup">
    <label for="presetSelect">保存した設定</label>
    <div class="preset-row">
      <select id="presetSelect"></select>
      <button type="button" class="mini" id="savePresetBtn">保存</button>
      <button type="button" class="mini" id="delPresetBtn">削除</button>
    </div>

    <label for="intervals">時間(秒)をカンマ区切りで入力</label>
    <input type="text" id="intervals" inputmode="numeric" value="60,10,50,10,50,10,120,10,120,10,60" autocomplete="off">
    <p class="hint">奇数番目=ストレッチ、偶数番目=休憩。<br>例: 120,10,120,10 → 2分ストレッチ→10秒休憩を2セット</p>
    <div class="row">
      <input type="checkbox" id="loop">
      <label for="loop" style="margin:0;font-size:14px;opacity:1">終わったら最初から繰り返す</label>
    </div>
    <div class="row">
      <input type="checkbox" id="secTick">
      <label for="secTick" style="margin:0;font-size:14px;opacity:1">毎秒音を鳴らす(休憩中は鳴らない)</label>
    </div>
  </div>

  <div class="display">
    <div class="phase-label" id="phaseLabel">準備OK?</div>
    <div class="time" id="time">--</div>
    <div class="sub" id="sub"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="controls">
    <button id="startBtn">スタート</button>
    <button id="resetBtn">リセット</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const timeEl=$('time'), phaseEl=$('phaseLabel'), subEl=$('sub'), barEl=$('bar');
  const startBtn=$('startBtn'), resetBtn=$('resetBtn');
  const inputEl=$('intervals'), loopEl=$('loop'), secTickEl=$('secTick'), setupEl=$('setup');

  let wakeLock=null;
  let state='idle'; // idle | ready | running | paused | done
  let plan=[], idx=0, remaining=0, rafId=null;

  // ---- 設定の保存/復元 ----
  const STORAGE_KEY='stretch-timer-settings';
  function loadSettings(){
    try{
      const s=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!s) return;
      if(typeof s.intervals==='string' && s.intervals.trim()!=='') inputEl.value=s.intervals;
      loopEl.checked=!!s.loop;
      secTickEl.checked=!!s.secTick;
    }catch(e){}
  }
  function saveSettings(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({intervals:inputEl.value, loop:loopEl.checked, secTick:secTickEl.checked}));
    }catch(e){}
  }
  inputEl.addEventListener('input',()=>{saveSettings();syncPresetSelection();});
  loopEl.addEventListener('change',()=>{saveSettings();syncPresetSelection();});
  secTickEl.addEventListener('change',()=>{saveSettings();syncPresetSelection();});
  loadSettings();

  // ---- プリセット(名前を付けて保存/選択) ----
  const PRESET_KEY='stretch-timer-presets';
  const presetSel=$('presetSelect'), savePresetBtn=$('savePresetBtn'), delPresetBtn=$('delPresetBtn');

  function loadPresets(){
    try{
      const p=JSON.parse(localStorage.getItem(PRESET_KEY));
      return Array.isArray(p)?p:[];
    }catch(e){ return []; }
  }
  function savePresets(list){
    try{ localStorage.setItem(PRESET_KEY, JSON.stringify(list)); }catch(e){}
  }
  function renderPresetOptions(selectedName){
    const list=loadPresets();
    presetSel.innerHTML='';
    const ph=document.createElement('option');
    ph.value='';
    ph.textContent=list.length ? '選択してください' : '(まだ保存がありません)';
    presetSel.appendChild(ph);
    for(const p of list){
      const o=document.createElement('option');
      o.value=p.name; o.textContent=p.name;
      presetSel.appendChild(o);
    }
    presetSel.value=selectedName||'';
    delPresetBtn.disabled=presetSel.value==='';
  }
  // 現在の入力がどれかのプリセットと一致していればそれを選択状態にする
  function syncPresetSelection(){
    const hit=loadPresets().find(p=>p.intervals===inputEl.value && !!p.loop===loopEl.checked && !!p.secTick===secTickEl.checked);
    presetSel.value=hit?hit.name:'';
    delPresetBtn.disabled=presetSel.value==='';
  }

  presetSel.addEventListener('change',()=>{
    const p=loadPresets().find(x=>x.name===presetSel.value);
    delPresetBtn.disabled=!p;
    if(!p) return;
    inputEl.value=p.intervals;
    loopEl.checked=!!p.loop;
    secTickEl.checked=!!p.secTick;
    saveSettings();
  });

  savePresetBtn.addEventListener('click',()=>{
    if(parsePlan().length===0){ alert('先に時間を入力してください(例: 120,10,120,10)'); return; }
    const name=(prompt('プリセット名を入力', presetSel.value||'')||'').trim();
    if(!name) return;
    const list=loadPresets();
    const i=list.findIndex(p=>p.name===name);
    if(i>=0){
      if(!confirm('「'+name+'」を上書きしますか?')) return;
      list[i]={name, intervals:inputEl.value, loop:loopEl.checked, secTick:secTickEl.checked};
    }else{
      list.push({name, intervals:inputEl.value, loop:loopEl.checked, secTick:secTickEl.checked});
    }
    savePresets(list);
    renderPresetOptions(name);
  });

  delPresetBtn.addEventListener('click',()=>{
    const name=presetSel.value;
    if(!name) return;
    if(!confirm('「'+name+'」を削除しますか?')) return;
    savePresets(loadPresets().filter(p=>p.name!==name));
    renderPresetOptions('');
  });

  renderPresetOptions('');
  syncPresetSelection();

  // ---- 音声 ----
  // 鳴らす音はすべて開始時に1本のWAVへ書き出し、<audio>で再生する。
  // メディア再生扱いになるので、他アプリ表示中や画面ロック中でもカウント音が鳴り続ける。
  // 表示側は audio.currentTime から現在位置を逆算するので、音と表示がズレない。
  const SR=11025, READY=3;
  const audio=new Audio(); audio.preload='auto';
  let introUrl=null, cycleUrl=null, onIntro=true, looping=false, starts=[], total=0, inReady=true;

  const S_TICK=[880,0.1,0.35];   // カウントダウン
  const S_SEC=[660,0.05,0.15];   // 毎秒の小さい音
  const S_GO=[1320,0.18,0.5];    // 区間開始

  // サイクル1周分の音 [時刻, 周波数, 長さ, 音量]
  function cycleEvents(offset){
    const ev=[], at=(t,s)=>ev.push([offset+t,...s]);
    plan.forEach((d,i)=>{
      const s=starts[i], end=s+d;
      at(s,S_GO);
      for(const k of [3,2,1]) if(d>k) at(end-k,S_TICK);
      if(d<=3) at(s,S_TICK);
      // 毎秒音(ストレッチ中のみ。休憩中とカウントダウン中は鳴らさない)
      if(secTickEl.checked && i%2===0) for(let n=4;n<Math.ceil(d);n++) at(end-n,S_SEC);
    });
    return ev;
  }

  // 8bitモノラルWAVを生成してBlob URLを返す
  function renderWav(len, events){
    let n=Math.ceil(len*SR); if(n%2) n++;
    const buf=new Float32Array(n);
    for(const [t,f,dur,vol] of events){
      const s0=Math.round(t*SR), m=Math.min(Math.round(dur*SR), n-s0);
      for(let j=0;j<m;j++){
        buf[s0+j]+=vol*Math.pow(0.001/vol, j/m)*Math.sin(2*Math.PI*f*j/SR);
      }
    }
    const bytes=new Uint8Array(44+n), dv=new DataView(bytes.buffer);
    const str=(o,s)=>{for(let i=0;i<s.length;i++) bytes[o+i]=s.charCodeAt(i);};
    str(0,'RIFF'); dv.setUint32(4,36+n,true); str(8,'WAVE');
    str(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,SR,true); dv.setUint32(28,SR,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true);
    str(36,'data'); dv.setUint32(40,n,true);
    for(let i=0;i<n;i++) bytes[44+i]=Math.max(0,Math.min(255,Math.round(128+127*buf[i])));
    return URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));
  }

  function buildAudio(){
    if(introUrl) URL.revokeObjectURL(introUrl);
    if(cycleUrl) URL.revokeObjectURL(cycleUrl);
    introUrl=cycleUrl=null;
    starts=[]; total=0;
    for(const d of plan){ starts.push(total); total+=d; }
    // 最初の音源 = 準備カウント3秒 + 1周目(繰り返さない場合は終了音つき)
    const intro=[[0,...S_TICK],[1,...S_TICK],[2,...S_TICK], ...cycleEvents(READY)];
    if(!looping) intro.push([READY+total,1320,0.15,0.5],[READY+total+0.18,1760,0.3,0.5]);
    introUrl=renderWav(READY+total+(looping?0:0.5), intro);
    // 繰り返す場合は2周目以降用の音源をループ再生する
    if(looping) cycleUrl=renderWav(total, cycleEvents(0));
  }

  function setMediaTitle(title){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata=new MediaMetadata({
        title, artist:'ストレッチタイマー',
        artwork:[{src:'./icons/icon-512.png', sizes:'512x512', type:'image/png'}]
      });
    }catch(e){}
  }

  function parsePlan(){
    const nums=inputEl.value.replace(/、/g,',').split(',')
      .map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)&&n>0);
    return nums;
  }
  const phaseName=i=> i%2===0 ? 'ストレッチ' : '休憩';

  function fmt(sec){
    sec=Math.max(0,Math.ceil(sec));
    const m=Math.floor(sec/60), s=sec%60;
    return m>0 ? m+':'+String(s).padStart(2,'0') : String(s);
  }

  function setBodyPhase(cls){
    document.body.classList.remove('phase-stretch','phase-rest','phase-ready');
    if(cls) document.body.classList.add(cls);
  }

  async function requestWakeLock(){
    try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function releaseWakeLock(){ try{ wakeLock&&wakeLock.release(); wakeLock=null; }catch(e){} }

  function render(){
    if(state==='ready'||(state==='paused'&&inReady)){
      phaseEl.textContent='スタートまで'+(state==='paused'?'(一時停止)':'');
      timeEl.textContent=fmt(remaining);
      subEl.textContent='次: '+phaseName(0)+' '+fmt(plan[0]);
      barEl.style.width='0%';
    }else if(state==='running'||state==='paused'){
      phaseEl.textContent=phaseName(idx)+(state==='paused'?'(一時停止)':'');
      timeEl.textContent=fmt(remaining);
      const total=plan[idx];
      barEl.style.width=(100*(1-remaining/total))+'%';
      const next=idx+1<plan.length ? '次: '+phaseName(idx+1)+' '+fmt(plan[idx+1])
                : (loopEl.checked?'次: 最初から繰り返し':'これが最後');
      subEl.textContent=(idx+1)+' / '+plan.length+' ・ '+next;
    }else if(state==='done'){
      phaseEl.textContent='おつかれさま!';
      timeEl.textContent='✓';
      subEl.textContent='';
      barEl.style.width='100%';
    }
  }

  function finish(){
    if(state==='idle'||state==='done') return;
    state='done'; cancelAnimationFrame(rafId);
    document.body.classList.remove('running');
    setBodyPhase(null); releaseWakeLock();
    startBtn.textContent='もう一度'; setupEl.classList.remove('hidden');
    setMediaTitle('おつかれさま!');
    render();
  }

  // 再生位置から現在の区間と残り時間を求める(音は音源側で鳴るのでここでは鳴らさない)
  function sync(){
    if(state!=='running'&&state!=='ready') return;
    const t=onIntro ? audio.currentTime-READY : audio.currentTime;
    if(t<0){
      inReady=true; state='ready'; remaining=-t;
    }else{
      if(!looping && t>=total){ finish(); return; }
      const tt=Math.min(t,total);
      let i=plan.length-1;
      while(i>0 && tt<starts[i]) i--;
      if(inReady||i!==idx){
        setBodyPhase(i%2===0?'phase-stretch':'phase-rest');
        setMediaTitle(phaseName(i)+'('+(i+1)+' / '+plan.length+')');
      }
      inReady=false; state='running'; idx=i;
      remaining=Math.max(0,starts[i]+plan[i]-tt);
    }
    render();
  }

  function loop(){
    sync();
    if(state==='running'||state==='ready') rafId=requestAnimationFrame(loop);
  }

  // バックグラウンドでは requestAnimationFrame が止まるので timeupdate でも位置を追う(ロック画面の表示用)
  audio.addEventListener('timeupdate',sync);
  audio.addEventListener('ended',()=>{
    if(state==='idle'||state==='done') return;
    if(looping && onIntro){
      onIntro=false; audio.src=cycleUrl; audio.loop=true;
      audio.play().catch(()=>{});
    }else{
      finish();
    }
  });
  // 一時停止/再開はロック画面や着信などで外から起きることもあるので、audio のイベントで状態を合わせる
  audio.addEventListener('pause',()=>{
    if(audio.ended || (state!=='running'&&state!=='ready')) return;
    state='paused'; cancelAnimationFrame(rafId);
    startBtn.textContent='再開'; render();
  });
  audio.addEventListener('play',()=>{
    if(state!=='paused') return;
    state=inReady?'ready':'running'; requestWakeLock();
    startBtn.textContent='一時停止';
    cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop);
  });
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',()=>{ if(state==='paused') audio.play().catch(()=>{}); });
      navigator.mediaSession.setActionHandler('pause',()=>{ if(state==='running'||state==='ready') audio.pause(); });
    }catch(e){}
  }

  function reset(){
    state='idle'; idx=0;
    cancelAnimationFrame(rafId); audio.pause(); releaseWakeLock();
    document.body.classList.remove('running'); setBodyPhase(null);
    setupEl.classList.remove('hidden');
    startBtn.textContent='スタート';
    phaseEl.textContent='準備OK?'; timeEl.textContent='--'; subEl.textContent='';
    barEl.style.width='0%';
  }

  startBtn.addEventListener('click',()=>{
    if(state==='running'||state==='ready'){ audio.pause(); return; } // 一時停止
    if(state==='paused'){ audio.play().catch(()=>{}); return; }      // 再開
    // idle / done → 開始
    plan=parsePlan();
    if(plan.length===0){ alert('時間を入力してください(例: 120,10,120,10)'); return; }
    saveSettings();
    looping=loopEl.checked;
    buildAudio();
    // 再生はユーザー操作(このクリック)の中で開始する必要がある
    onIntro=true; audio.loop=false; audio.src=introUrl;
    audio.play().catch(()=>{ reset(); alert('音声を再生できませんでした'); });
    requestWakeLock();
    setupEl.classList.add('hidden');
    state='ready'; idx=0; inReady=true; remaining=READY;
    setBodyPhase('phase-ready');
    document.body.classList.add('running');
    startBtn.textContent='一時停止';
    setMediaTitle('スタートまで');
    render();
    cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop);
  });

  resetBtn.addEventListener('click',reset);

  document.addEventListener('visibilitychange',()=>{
    // 画面スリープ防止はバックグラウンドで解除されるので、戻ってきたら取り直す
    if(document.visibilityState==='visible'&&(state==='running'||state==='ready')) requestWakeLock();
  });

  // ---- PWA: Service Worker 登録 ----
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
